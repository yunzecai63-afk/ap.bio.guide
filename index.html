<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Bio Guide</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #e0f7fa, #fff3e0);
      color: #333;
    }

    header {
      background-color: #00796b;
      color: white;
      padding: 30px 20px;
      text-align: center;
      font-size: 2.5em;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background-color: #004d40;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 15px 25px;
      font-size: 1.1em;
      transition: background 0.3s, transform 0.2s;
    }

    nav a:hover {
      background-color: #00796b;
      transform: scale(1.05);
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 150px);
      text-align: center;
    }

    main h2 {
      font-size: 2em;
      max-width: 600px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 15px;
      background-color: #004d40;
      color: white;
    }
  </style>
</head>
<body>
  <header>AP Bio Guide</header>
  <nav>
    <a href="#">Chemistry of Life</a>
    <a href="#">Cells</a>
    <a href="#">Cellular Energetics</a>
    <a href="#">Cell Communication & Cell Cycle</a>
    <a href="#">Heredity</a>
    <a href="#">Gene Expression & Regulation</a>
    <a href="#">Natural Selection</a>
    <a href="#">Ecology</a>
  </nav>
  <main>
    <h2>Welcome to your AP Biology Guide! Click a unit above to start learning and exploring biology concepts interactively.</h2>
  </main>
  <footer>© 2026 AP Bio Guide</footer>
</body>
</html>
